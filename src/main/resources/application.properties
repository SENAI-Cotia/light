# Conexão MYSQL
spring.application.name=kofi

# Configs
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kofi}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (Hibernate e JDBC)
spring.jpa.hibernate.ddl-auto=update

# SQL no Terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Senha acesso página de cadastro
app.route.password=${APP_ROUTE_PASS:123}


# Desabilitar Cache dos templates
spring.thymeleaf.cache=false

# Live Reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true