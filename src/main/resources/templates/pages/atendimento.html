<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <th:block th:insert="~{fragments/head :: common-head('Kofi Ctrl | Atendimento', 'atendimento')}"></th:block>
</head>
<body>

<aside>
    <div th:replace="~{fragments/navbar :: menu-toggle}"></div>

    <div th:replace="~{fragments/navbar :: navbar('atendimento')}"></div>
</aside>

<main>
    <th:block th:insert="~{fragments/header:: header('bell-dark', 'ATENDIMENTO')}"></th:block>

    <div class="pedidos-container">
        <div class="quick-actions">
            <div class="search-bar">
                <button class="search-button" type="button">
                    <img src="/assets/icons/magnifying.svg" alt="Pesquisar produto"/>
                </button>

                <input aria-label="Busca por produtos" name="search"
                       placeholder="Pesquise por produto. Digite pelo menos 3 caracteres" type="text">
            </div>

            <button type="button" class="create-product primary-element" id="main-content-switcher-button">Listar pedidos</button>
        </div>

        <form id="form-pedido" th:action="@{/atendimento/salvar}" method="post" class="painel-container">

            <div id="itens-ocultos"></div>

            <div class="produtos-container scrollable-container">
                <div class="produtos-filtro">
                    <button type="button" class="secondary-element filtro-btn ativo" data-filtro="todos">Todos</button>

                    <button type="button" class="secondary-element filtro-btn" data-filtro="bebida">Bebidas</button>

                    <button type="button" class="secondary-element filtro-btn" data-filtro="lanche">Lanches</button>

                    <button type="button" class="secondary-element filtro-btn" data-filtro="acompanhamento">Acompanhamentos</button>

                    <button type="button" class="secondary-element filtro-btn" data-filtro="sobremesa">Sobremesas</button>
                </div>

                <div class="main-scrollable-container-child">
                    <div class="produtos-lista">
                        <div th:each="produto : ${produtos}">
                            <div
                                    class="produto-card"
                                    th:data-id="${produto.id}"
                                    th:data-nome="${produto.nome}"
                                    th:data-preco="${produto.preco}"
                                    th:data-categoria="${produto.categoria}"
                            >
                                <div class="produto-imagem">
                                    <img th:src="${produto.urlImagem}" th:alt="${produto.nome}">
                                </div>

                                <div class="produto-infos">
                                    <div class="produto-detalhes">
                                        <h3 th:text="${produto.nome}"></h3>
                                        <h4 th:text="${'R$' + produto.preco}"></h4>
                                    </div>

                                    <button type="button" onclick="adicionar(this)">
                                        <img th:src="@{/assets/icons/add-circle.svg}" alt="Adicionar produto ao pedido"/>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="novo-pedido-container">
                <h3>Dados do pedido</h3>
                <div class="field">
                    <label for="campo-observacao-pedido">Observações do pedido</label>
                    <textarea rows="2" id="campo-observacao-pedido"
                              name="observacao"
                    ></textarea>
                </div>

                <div id="lista-selecionados">
                    <p id="msg-vazia">Nenhum item adicionado.</p>
                </div>

                <div class="totais">
                    <span>Total: </span>
                    <span id="valor-total">R$ 0,00</span>
                </div>

                <div class="forma-pagamento">
                    <div class="titulo-card">
                        <h4>Pagamento</h4>
                    </div>

                    <div class="opcoes-pagamento">
                        <label class="opcao-pagamento">
                            <input type="radio" name="formaPagamento" value="DINHEIRO" required>
                            <div class="card-pagamento">
                                <div class="icon"><img th:src="@{/assets/icons/money.svg}"></div>
                                <span>Dinheiro</span>
                            </div>
                        </label>

                        <label class="opcao-pagamento">
                            <input type="radio" name="formaPagamento" value="CARTAO_DEBITO" required>
                            <div class="card-pagamento">
                                <div class="icon"><img th:src="@{/assets/icons/debit-card.svg}"></div>
                                <span>Débito</span>
                            </div>
                        </label>

                        <label class="opcao-pagamento">
                            <input type="radio" name="formaPagamento" value="PIX" required>
                            <div class="card-pagamento">
                                <div class="icon"><img th:src="@{/assets/icons/pix.svg}"></div>
                                <span>Pix</span>
                            </div>
                        </label>

                        <label class="opcao-pagamento">
                            <input type="radio" name="formaPagamento" value="CARTAO_CREDITO" required>
                            <div class="card-pagamento">
                                <div class="icon"><img th:src="@{/assets/icons/credit-card.svg}"></div>
                                <span>Crédito</span>
                            </div>
                        </label>
                    </div>

                    <!-- Campo hidden para enviar o total -->
                    <input type="hidden" id="total-pedido" name="valorTotal" value="0">
                </div>

                <div>
                    <button type="reset">
                        Cancelar
                    </button>
                    <button type="submit">
                        Confirmar pedido
                    </button>
                </div>
            </div>
        </form>

        <div class="pedidos-grid hidden">
            <div class="listagem-container scrollable-container">

                <div class="main-scrollable-container-child">
                    <table class="pedidos-table">
                        <thead>
                        <tr>
                            <th>Nº pedido</th>
                            <th>Status</th>
                            <th>Data de criação</th>
                            <th>Hora de criação</th>
                            <th>Valor total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${pedido.numeroPedido}"></td>
                            <td th:text="${pedido.status}"></td>
                            <td th:text="${#temporals.format(pedido.criadoEm, 'dd/MM/yyyy')}"></td>
                            <td th:text="${#temporals.format(pedido.criadoEm, 'HH:mm')}"></td>
                            <td th:text="${'R$ ' + #aggregates.sum(pedido.itens.![quantidade * precoUnitario])}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script defer>
        const trocarConteudo = document.getElementById("main-content-switcher-button")
        const painelPedido = document.querySelector(".painel-container")
        const painelItens = document.querySelector(".pedidos-grid")

        trocarConteudo.addEventListener("click", () => {
            painelPedido.classList.toggle("hidden")
            painelItens.classList.toggle("hidden")

            painelPedido.classList.contains("hidden") ? trocarConteudo.innerText = "Novo pedido" : trocarConteudo.innerText = "Listar pedidos"
        })

        /* filtro */
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();

                const filtro = btn.dataset.filtro;
                filtrar(filtro);

                // Remove ativo
                document.querySelectorAll('.filtro-btn').forEach(b => {
                    b.classList.remove('ativo');
                });

                // Add ativo
                btn.classList.add('ativo');
            });
        });


        const itensSelecionados = new Map();


        function adicionar(btn) {
            const card = btn.closest('.produto-card');
            const id    = card.dataset.id;
            const nome  = card.dataset.nome;
            const preco = parseFloat(card.dataset.preco);

            if (itensSelecionados.has(id)) {
                itensSelecionados.get(id).quantidade++;
            } else {
                itensSelecionados.set(id, { id, nome, preco, quantidade: 1 });
            }

            renderizarConta();
        }

        function remover(id) {
            itensSelecionados.delete(id);
            renderizarConta();
        }


        function mudarQuantidade(id, valor) {
            const qtd = parseInt(valor);
            if (qtd < 1 || isNaN(qtd)) return;
            itensSelecionados.get(id).quantidade = qtd;
            renderizarConta();
        }


        function renderizarConta() {
            const lista = document.getElementById('lista-selecionados');

            if (itensSelecionados.size === 0) {
                lista.innerHTML = '<p id="msg-vazia">Nenhum item adicionado.</p>';
                document.getElementById('valor-total').textContent = 'R$ 0,00';
                document.getElementById('total-pedido').value = '0';
                return;
            }

            let total = 0;
            let html  = '';

            itensSelecionados.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                total += subtotal;

                html += `
            <div class="item-selecionado">
                <div class="item-info">
                    <strong>${item.nome}</strong>
                    <span>R$ ${item.preco.toFixed(2)} x ${item.quantidade} = R$ ${subtotal.toFixed(2)}</span>
                </div>
                <div class="item-acoes">
                    <input type="number" min="1" value="${item.quantidade}"
                           onchange="mudarQuantidade('${item.id}', this.value)"
                           style="width: 50px"/>
                    <button type="button" onclick="remover('${item.id}')">✕</button>
                </div>
            </div>
        `;
            });

            lista.innerHTML = html;
            const totalFormatado = total.toFixed(2).replace('.', ',');
            document.getElementById('valor-total').textContent = 'R$ ' + totalFormatado;
            document.getElementById('total-pedido').value = total.toFixed(2);
        }

        function filtrar(categoria) {
            document.querySelectorAll('.produto-card').forEach(card => {
                const pertence = categoria === 'todos' || card.dataset.categoria === categoria;
                card.style.display = pertence ? '' : 'none';
            });
        }


        const form = document.getElementById('form-pedido');
        console.log('form:', form);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (itensSelecionados.size === 0) {
                alert('Adicione ao menos um produto.');
                return;
            }

            const formaPagamentoSelecionada = document.querySelector('input[name="formaPagamento"]:checked');
            if (!formaPagamentoSelecionada) {
                alert('Selecione uma forma de pagamento.');
                return;
            }

            const container = document.getElementById('itens-ocultos');
            container.innerHTML = '';

            let index = 0;
            itensSelecionados.forEach(item => {
                criarOculto(container, `itens[${index}].produto.id`, item.id);
                criarOculto(container, `itens[${index}].quantidade`, item.quantidade);
                index++;
            });

            this.submit();
        });

        function criarOculto(container, name, value) {
            const input = document.createElement('input');
            input.type  = 'hidden';
            input.name  = name;
            input.value = value;
            container.appendChild(input);
        }
    </script>
</main>
</body>
</html>
