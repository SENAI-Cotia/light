<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <th:block th:insert="~{fragments/head :: common-head('Kofi Ctrl | Atendimento', 'atendimento')}"></th:block>
</head>
<body>

<aside>
    <div th:replace="~{fragments/navbar :: menu-toggle}"></div>

    <div th:replace="~{fragments/navbar :: navbar('atendimento')}"></div>
</aside>

<main>
    <th:block th:insert="~{fragments/header:: header('bell-dark', 'ATENDIMENTO')}"></th:block>

    <div class="pedidos-container">
        <div class="quick-actions">
            <div class="search-bar">
                <button class="search-button" type="button">
                    <img src="/assets/icons/magnifying.svg" alt="Pesquisar produto"/>
                </button>

                <input aria-label="Busca por produtos" name="search"
                       placeholder="Pesquise por produto. Digite pelo menos 3 caracteres" type="text">
            </div>

            <button type="button" class="create-product primary-element" id="main-content-switcher-button">Listar pedidos</button>
        </div>

        <form id="form-pedido" th:action="@{/atendimento/salvar}" method="post" class="painel-container">
<!--            <input type="hidden" name="usuarioId" th:value=${#authentication.principal.id} />-->
            <div id="itens-ocultos"></div>

            <div class="produtos-container">
                <div class="produtos-filtro">
                    <button type="button" class="secondary-element ">Todos</button>

                    <button type="button" class="secondary-element">Combos</button>

                    <button type="button" class="secondary-element">Promoções</button>

                    <select aria-label="categoria" class="secondary-element">
                        <option>Categorias</option>
                        <option value="bebida">Bebidas</option>
                        <option value="lanche">Lanches</option>
                        <option value="acompanhamento">Acompanhamentos</option>
                        <option value="sobremesa">Sobremesas</option>
                    </select>
                </div>

                <div class="produtos-lista">
                    <div th:each="produto : ${produtos}">
                        <!-- TODO: adicionar os css, a classe esta aqui apenas para lembrar -->
                        <div
                                class="produto-card"
                                th:data-id="${produto.id}"
                                th:data-nome="${produto.nome}"
                                th:data-preco="${produto.preco}"
                                th:data-categoria="${produto.categoria}"
                        >
                            <div class="produto-imagem">
                                <img th:src="${produto.urlImagem}" th:alt="${produto.nome}">
                            </div>

                            <div class="produto-infos">
                                <div class="produto-detalhes">
                                    <h3 th:text="${produto.nome}"></h3>
                                    <h4 th:text="${'R$' + produto.preco}"></h4>
                                </div>

                                <button type="button" onclick="adicionar(this)">
                                    <img th:src="@{/assets/icons/add-circle.svg}" alt="Adicionar produto ao pedido"/>
                                </button>
                            </div>
                        </div>
                    </div>


                </div>
            </div>

            <div class="novo-pedido-container">
                <h3>Dados do pedido</h3>
                    <div class="field">
                        <label for="campo-observacao-pedido">Observações do pedido</label>
                        <textarea rows="6" id="campo-observacao-pedido"
                                  name="observacao"
                                  required></textarea>
                    </div>

                    <div id="lista-selecionados">
                        <p id="msg-vazia">Nenhum item adicionado.</p>
                    </div>

                    <div class="totais">
                        <span>Total: </span>
                        <span id="valor-total">R$ 00,00</span>
                    </div>

                    <div>
                        <button type="reset">
                            Cancelar
                        </button>
                        <button type="submit">
                            Confirmar pedido
                        </button>
                    </div>
            </div>
        </form>

        <div class="pedidos-grid hidden">
            <h2>Listagem</h2>
        </div>
    </div>

    <script defer>
        const trocarConteudo = document.getElementById("main-content-switcher-button")
        const painelPedido = document.querySelector(".painel-container")
        const painelItens = document.querySelector(".pedidos-grid")

        trocarConteudo.addEventListener("click", () => {
            painelPedido.classList.toggle("hidden")
            painelItens.classList.toggle("hidden")

            painelPedido.classList.contains("hidden") ? trocarConteudo.innerText = "Novo pedido" : trocarConteudo.innerText = "Listar pedidos"
        })









        // Map: produtoId (string) → { id, nome, preco, quantidade }
        const itensSelecionados = new Map();

        // --- ADICIONAR ---
        function adicionar(btn) {
            const card = btn.closest('.produto-card');
            const id    = card.dataset.id;
            const nome  = card.dataset.nome;
            const preco = parseFloat(card.dataset.preco);

            if (itensSelecionados.has(id)) {
                // já está na lista — só aumenta a quantidade
                itensSelecionados.get(id).quantidade++;
            } else {
                itensSelecionados.set(id, { id, nome, preco, quantidade: 1 });
            }

            renderizarConta();
        }

        // --- REMOVER ---
        function remover(id) {
            itensSelecionados.delete(id);
            renderizarConta();
        }

        // --- MUDAR QUANTIDADE ---
        function mudarQuantidade(id, valor) {
            const qtd = parseInt(valor);
            if (qtd < 1 || isNaN(qtd)) return;
            itensSelecionados.get(id).quantidade = qtd;
            renderizarConta();
        }

        // --- RENDERIZAR A DIREITA ---
        function renderizarConta() {
            const lista = document.getElementById('lista-selecionados');
            const msgVazia = document.getElementById('msg-vazia');

            if (itensSelecionados.size === 0) {
                lista.innerHTML = '';
                lista.appendChild(msgVazia);
                document.getElementById('valor-total').textContent = 'R$ 0,00';
                return;
            }

            let total = 0;
            let html  = '';

            itensSelecionados.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                total += subtotal;

                html += `
            <div class="item-selecionado">
                <div class="item-info">
                    <strong>${item.nome}</strong>
                    <span>R$ ${item.preco.toFixed(2)} x ${item.quantidade} = R$ ${subtotal.toFixed(2)}</span>
                </div>
                <div class="item-acoes">
                    <input type="number" min="1" value="${item.quantidade}"
                           onchange="mudarQuantidade('${item.id}', this.value)"
                           style="width: 50px"/>
                    <button type="button" onclick="remover('${item.id}')">✕</button>
                </div>
            </div>
        `;
            });

            lista.innerHTML = html;
            document.getElementById('valor-total').textContent =
                'R$ ' + total.toFixed(2).replace('.', ',');
        }

        // --- FILTRO POR CATEGORIA ---
        function filtrar(categoria) {
            document.querySelectorAll('.produto-card').forEach(card => {
                const pertence = categoria === 'todos' || card.dataset.categoria === categoria;
                card.style.display = pertence ? '' : 'none';
            });

            document.querySelectorAll('.filtros button').forEach(btn => {
                btn.classList.toggle('filtro-ativo', btn.textContent === categoria ||
                    (categoria === 'todos' && btn.textContent === 'Todos'));
            });
        }


        // SUBMIT
        const form = document.getElementById('form-pedido');
        console.log('form:', form);

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (itensSelecionados.size === 0) {
                alert('Adicione ao menos um produto.');
                return;
            }

            const container = document.getElementById('itens-ocultos');
            container.innerHTML = '';

            let index = 0;
            itensSelecionados.forEach(item => {
                criarOculto(container, `itens[${index}].produto.id`, item.id);
                criarOculto(container, `itens[${index}].quantidade`, item.quantidade);
                index++;
            });

            this.submit();
        });

        function criarOculto(container, name, value) {
            const input = document.createElement('input');
            input.type  = 'hidden';
            input.name  = name;
            input.value = value;
            container.appendChild(input);
        }
    </script>
</main>
</body>
</html>
