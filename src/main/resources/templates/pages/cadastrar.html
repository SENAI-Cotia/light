<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/cadastrar.css}" />
    <script type="text/javascript" th:src="@{/js/alertas.js}" defer></script>
    <title>Cadastro | Kofi</title>

</head>
<body>

<div class="registro-container">
    <div id="msg-erro" th:if="${erro}" th:text="${erro}" class="alerta-msg"></div>
    <div id="msg-sucesso" th:if="${sucesso}" th:text="${sucesso}" class="alerta-msg"></div>

    <h2>Kofi Ctrl - Cadastro de Usuário</h2>

    <form th:action="@{/cadastrar}" method="post" class="registro-form">

        <h3>Dados do Usuário</h3>

        <div class="input-group">
            <label for="nome">Nome completo: </label>
            <input type="text" id="nome" name="nome" required maxlength="100">
        </div>

        <div class="input-group">
            <label for="email">E-mail: </label>
            <input type="email" id="email" name="email" required maxlength="150">
        </div>

        <div class="input-group">
            <label for="senha">Senha: </label>
            <input type="password" id="senha" name="senha" required minlength="6">
        </div>

        <div class="input-group">
            <label for="papel">Perfil de acesso: </label>
            <select id="papel" name="papel" required>
                <option value="">-- Selecione --</option>
                <option value="ADMIN">Administrador</option>
                <option value="FUNCIONARIO">Funcionário</option>
            </select>
        </div>

        <div class="button-group">
            <input type="submit" value="Cadastrar usuário" class="secondary-element">
            <input type="reset" value="Limpar campos" class="secondary-element">
        </div>

    </form>

    <p><a href="/login" style="color: var(--vanilla);">Voltar para o login</a></p>

</div>

</body>
</html>
