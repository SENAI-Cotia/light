<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{fragments/head :: common-head('Kofi Ctrl | Dashboard', 'dashboard')}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" th:src="@{/js/dashboard.js}" defer></script>
</head>
<body>
<aside>
    <div th:replace="~{fragments/navbar :: menu-toggle}"></div>

    <div th:replace="~{fragments/navbar :: navbar('dashboard')}"></div>
</aside>

<main class="dashboard-main">
    <th:block th:insert="~{fragments/header:: header('coffee-bean-dark', 'DASHBOARD')}"></th:block>

    <div class="dash-header">

        <div class="revenue-card">
            <div class="icon">
                <img th:src="@{/assets/images/coffee-pot.svg}" alt="">
            </div>
            <div class="monthly-content">
                <div class="total-earned">
                    <h2>Total faturado</h2>
                    <p>mês: abril</p>
                    <h3>R$1.200,00</h3>
                </div>
                <div class="ticket-container">
                    <div class="average-ticket">
                        <p>ticket médio</p>
                        <p>R$79,00</p>
                    </div>
                    <div class="highest-ticket">
                        <p>maior pedido</p>
                        <p>R$109,00</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="dish-status">
            <div class="late-dishes">
                <p>Pratos em <br>atraso</p>
                <div class="quantity">
                    <p>11</p>
                    <img th:src="@{/assets/icons/cup.svg}" alt="">
                </div>
            </div>
            <div class="in-prepare"><p>Pratos em <br>preparo</p>
                <div class="quantity">
                    <p>7</p>
                    <img th:src="@{/assets/icons/dish.svg}" alt="">
                </div>
            </div>
        </div>

        <div class="orders-graph">
            <canvas id="kofiChart"></canvas>
        </div>
    </div>

    <div class="orders-list"></div>

    <div class="orders-info"></div>
</main>

</body>

</html>
